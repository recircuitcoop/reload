# electron-builder config (plan 0018 §1, §8.3 WI-0018-23): per-arch packages with bundled
# runtimes, without npm. Run from app/ (the project directory electron-builder resolves every
# relative path against), with `--config packaging/electron-builder.yml`.
#
# Not committed under app/build/: that name is already gitignored (Python's `build/` rule,
# repo root .gitignore) as Briefcase's build output, and it is where this file's own
# `directories.buildResources` and tools/runtimes/fetch.mjs's fetched runtimes both land — so
# the two never collide with what git tracks.

appId: it.recircu.reload
# The same string setAppUserModelId (adapters/electron/notifier.ts) raises toasts under, so a
# notification click and the window class agree (arch_pivot §4).
productName: Reload
copyright: Copyright © 2026 Re:Circuit Cooperative

directories:
  # tools/runtimes/fetch.mjs's own output; also electron-builder's buildResources scratch dir.
  buildResources: build
  output: release

# Only what the packaged app needs; devDependencies (typescript, vitest, playwright, esbuild,
# electron itself, electron-builder) are never electron-builder's default include, but the two
# explicit exclusions below are the ones WI-0018-23 requires by name: npm is not in the bundle
# (node_modules/npm), and nothing test-only ships (node_modules/.bin, source .ts).
files:
  - dist/**/*
  # The build's own tooling (dist/build: the shipped-package manifest's writer) never ships;
  # what it wrote, dist/shipped-packages.json, does (plan 0022 §F). after-pack.cjs checks both.
  - "!dist/build/**"
  - package.json
  - node_modules/**/*
  - "!node_modules/npm/**"
  - "!node_modules/.bin/**"
  - "!node_modules/**/*.map"
  - "!test/**"
  - "!src/**"
  # @node-red/registry's lib/externalModules.js runs `require.resolve('npm/package.json')`
  # unconditionally at import time (not gated behind any install feature), so simply excluding
  # npm crash-loops the runtime process at startup. packaging/npm-stub is a placeholder with no
  # bin/ and no dependencies: it satisfies that one resolve call, and nothing else — every
  # actual install route is disabled (adapters/nodered/settings.ts), and the spawn wrapper
  # refuses npm and npx by name regardless (adapters/process/command.ts).
  - from: "packaging/npm-stub"
    to: "node_modules/npm"

# packages/* is a monorepo sibling of app/, one level above where dist/<child>/main.cjs's own
# __dirname/../.. resolves to (APP_DIR, runtime/main.ts and shell/main.ts) — so it is never part
# of app.asar; it is copied beside it, as PACKAGE_ROOTS[0] = path.join(APP_DIR, "..", "packages")
# expects. The fetched runtimes (tools/runtimes/fetch.mjs) land the same way, at Resources/
# runtimes, which shell/main.ts's RELOAD_RUNTIMES_DIR points every child at (WI-0018-23).
#
# ${os}-${arch} is electron-builder's own per-target macro (mac-arm64, mac-x64, linux-arm64,
# linux-x64): it names exactly the folder tools/runtimes/fetch.mjs writes for that target, so
# only ONE target's runtimes are ever bundled, never all four.
extraResources:
  - from: "../packages"
    to: "packages"
    filter: ["**/*", "!**/node_modules/**", "!**/*.pyc", "!**/__pycache__/**"]
  - from: "build/runtimes/${os}-${arch}"
    to: "runtimes"
  # The 10-second sample Setup's "Try with a sample" copies into the starter flow's watched
  # folder (plan 0022 §H, app/resources/sample/README.md): Resources/sample in the package.
  - from: "resources/sample"
    to: "sample"
  # The header helper AI apps run to get the endpoint's token (plan 0033 §A,
  # app/resources/mcp-helper/): Resources/mcp-helper/reload-mcp-headers, executable. after-pack.cjs
  # checks the bit survived, after signing.
  - from: "resources/mcp-helper"
    to: "mcp-helper"

# app/test/fixtures IS part of app/ (dist/**/* above brings dist/, but the fixtures the fixture
# node types declare live under test/fixtures and must be real files for a Python or JS fixture
# node to run, never compressed inside app.asar).
# node_modules too: the Anytype MCP child runs on the bundled Node, which is plain Node and
# cannot read inside app.asar, so its entry and its whole dependency tree must be real files
# (services/main.ts hands it the app.asar.unpacked path). The npm stub is matched by its source
# path (packaging/npm-stub), not this pattern, so it stays packed; after-pack.cjs checks.
asarUnpack:
  - "test/fixtures/**"
  - "node_modules/**"

asar: true

afterPack: packaging/after-pack.cjs

# Where releases live (plan 0034): electron-builder writes latest-mac.yml against it, which
# the release step signs with the owner's minisign key (docs/specs/release-feed.md). Releases
# are built from this config while no Developer ID exists; `--publish never` keeps uploads manual.
publish:
  provider: github
  owner: recircuitcoop
  repo: reload

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: "packaging/icons/reload.icns"
  # The arch in every name, x64 included (electron-builder leaves it out for x64 by default):
  # the update check picks this Mac's zip by its -<arch>- segment (release-metadata.ts).
  artifactName: "${productName}-${version}-${arch}-mac.${ext}"
  # No Developer ID in this environment (WI-0018-24 owns real signing, notarising and the
  # hardened runtime with its entitlements): ad-hoc signed, unhardened, which is enough to
  # launch and run the packaged smoke test on this machine. hardenedRuntime without a real
  # signing identity and entitlements plist made the app hang silently on launch (no window,
  # no log line, killed only by a timeout) — almost certainly the V8 JIT unable to allocate
  # executable memory under the hardened runtime's default restrictions.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null

linux:
  target:
    - target: AppImage
      arch: [arm64, x64]
    - target: deb
      arch: [arm64, x64]
  icon: "packaging/icons/reload.png"
  category: Development
  executableName: reload

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# The arch in the disk image name too, as each release has shipped it by hand.
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
