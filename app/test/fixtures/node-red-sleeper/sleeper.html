<script type="text/javascript">
  for (const type of ["reload-rawnode-sleeper", "reload-rogue-sleeper"]) {
    RED.nodes.registerType(type, {
      category: "Reload",
      defaults: { name: { value: "" } },
      inputs: 1,
      outputs: 0,
      label: function () {
        return this.name || type;
      },
    });
  }
</script>
